name: Build-n-Release

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: Release Version
        required: true
      test:
        required: true
        type: boolean
      release:
        required: true
        type: boolean
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y libaio-dev libleveldb-dev libsnappy-dev g++ libcap2-bin libpcap-dev libseccomp-dev jq openssl ca-certificates
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.22
             
    - name: Compile Stenographer
      run: |
        go mod tidy
        go get ./...
        go build
        make -C stenotype
        
    - name: Test Stenographer
      run: |
        go test ./...
        
    - name: Integration Test
      if:  ${{ inputs.test }}
      run: bash integration_test/test.sh
      
    - run: |
        echo "VERSION=${{ (github.ref_name == 'master' && github.event_name == 'workflow_dispatch') && github.event.inputs.ref_name || github.ref_name }}" >> $GITHUB_ENV

    - name: get NFPM
      if:  ${{ inputs.release }}
      run: |
          wget -qO- https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar --directory ./ -xz nfpm
          chmod +x nfpm

    - name: Create Packages
      if:  ${{ inputs.release }}
      env:
          VERSION: ${{ env.VERSION }}
          PACKAGE: "stenographer"
          RELEASE: ${{ env.VERSION }}
          ARCH: "amd64"
      run: |
          ./nfpm pkg --config nfpm.yaml --target "./$PACKAGE-$RELEASE-$ARCH.deb"
          ./nfpm pkg --config nfpm.yaml --target "./$PACKAGE-$RELEASE-$ARCH.rpm"

    - name: Upload release
      if:  ${{ inputs.release }}
      uses: boxpositron/upload-multiple-releases@1.0.7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        release_config: |
            stenographer
            stenoread
            stenographer*.deb
            stenographer*.rpm
        tag_name: ${{ env.VERSION }}
        release_name: ${{ env.VERSION }}
        draft: false
        prerelease: false
        overwrite: true   
        
    - name: Log in to the Container registry
      if:  ${{ inputs.release }}
      uses: docker/login-action@v2.0.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker Build and push (server)
      if:  ${{ inputs.release }}
      uses: docker/build-push-action@v3.0.0
      with:
        context: ./docker
        push: true
        tags: |
           ghcr.io/qxip/stenographer:latest
           ghcr.io/qxip/stenographer:${{ env.VERSION }}
