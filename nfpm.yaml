name: "stenographer"
arch: "amd64"
platform: "linux"
version: "v1.0.1"
section: "default"
priority: "extra"
replaces:
  - stenographer
provides:
  - stenographer
recommends:
  - tcpdump
  - jq
suggests:
  - tshark
maintainer: "QXIP BV <bot@qxip.net>"
description: |
  Stenographer is a full-packet-capture utility for buffering packets 
  to disk for intrusion detection and incident response purposes.
vendor: "qxip"
homepage: "http://github.com/qxip/stenographer"
license: "Apache2"

# Updated contents block using new format
contents:
  - src: ./stenocurl
    dst: /usr/bin/stenocurl
    file_info:
      mode: 0755

  - src: ./stenoread
    dst: /usr/bin/stenoread
    file_info:
      mode: 0755

  - src: ./stenokeys.sh
    dst: /opt/stenographer/stenokeys.sh
    file_info:
      mode: 0755

  - src: ./stenographer
    dst: /usr/bin/stenographer
    file_info:
      mode: 0700
      owner: stenographer
      group: root

  - src: ./stenotype/stenotype
    dst: /usr/bin/stenotype
    file_info:
      mode: 0500
      owner: stenographer
      group: root

  # Config files
  - dst: /opt/stenographer
    type: dir

  - dst: /opt/stenographer/configs
    type: dir

  - src: ./configs/*
    dst: /opt/stenographer/configs/

overrides:
  rpm:
    scripts:
      postinstall: ./scripts/postinstall.sh
  deb:
    scripts:
      postinstall: ./scripts/postinstall.sh
