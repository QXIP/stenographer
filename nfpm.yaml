name: "stenographer"
arch: "amd64"
platform: "linux"
version: "v1.0.1"
section: "default"
priority: "extra"
replaces:
  - stenographer
provides:
  - stenographer
recommends:
  - tcpdump
  - jq
suggests:
  - tshark
maintainer: "QXIP BV <bot@qxip.net>"
description: |
  Stenographer is a full-packet-capture utility for buffering packets 
  to disk for intrusion detection and incident response purposes.
vendor: "qxip"
homepage: "http://github.com/qxip/stenographer"
license: "Apache2"
empty_folders:
  - /opt/stenographer
  - /opt/stenographer/configs
files:
  /usr/bin/stenocurl:
    file: ./stenocurl
    mode: 0755
  /usr/bin/stenoread:
    file: ./stenoread
    mode: 0755
  /usr/bin/stenographer:
    file: ./stenographer
    mode: 0700
    owner: stenographer
    group: root
  /usr/bin/stenotype:
    file: ./stenotype/stenotype
    mode: 0500
    owner: stenographer
    group: root
  /opt/stenographer/stenokeys.sh:
    file: ./stenokeys.sh
    mode: 0755
config_files:
  /opt/stenographer/configs:
    file: ./configs/*
overrides:
  rpm:
    scripts:
      postinstall: ./scripts/postinstall.sh
  deb:
    scripts:
      postinstall: ./scripts/postinstall.sh
